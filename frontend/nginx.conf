server {
    listen 80;
    
    # React Statik Dosyaları
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html; # React Router için hayati önemde!
    }

    # API İsteklerini Django'ya Yönlendir (Reverse Proxy)
    location /api/ {
        proxy_pass http://backend:8000; # Docker-compose'daki servis adı
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django Admin ve Statik/Media dosyaları (3D modeller burada olabilir)
    location /admin/ { proxy_pass http://backend:8000; }
    location /static/ { alias /app/static/; }
    location /media/ { alias /app/media/; }
}