server {
    listen 80;

    client_max_body_size 50M; # Büyük dosya yüklemeleri için (3D modeller gibi)
    
    # React Statik Dosyaları
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html; # React Router için hayati önemde!
    }

    # API İsteklerini Django'ya Yönlendir (Reverse Proxy)
    location /api/ {
        proxy_pass http://backend:8000; # Docker-compose'daki servis adı
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django Admin Panelini Yönlendir
    location /admin/ { 
        proxy_pass http://backend:8000; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django Statik ve Media dosyaları (KRİTİK DÜZELTME BURADA)
    location /static/ { alias /app/staticfiles/; } # 'static' değil, 'staticfiles' olacak!
    location /media/ { alias /app/media/; }
}